name: Campsite Watch

# GitHub's free-tier cron jitters (a new repo took ~1h to activate at all), so
# rather than a short job every 10 minutes, this fires hourly and each run polls
# for ~55 minutes. A delayed trigger costs a gap, not the whole schedule.
on:
  schedule:
    - cron: "3 * * * *" # a few past the hour; the top of the hour is the congested slot
  workflow_dispatch:

concurrency:
  group: campsite-watch
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install camply
        run: pip install --quiet camply==0.34.2

      # Carries "already reported" state across runs so a site that stays open
      # doesn't re-notify every hour.
      - name: Restore seen-campsites state
        uses: actions/cache@v4
        with:
          path: camply_campsites.json
          key: campsites-${{ github.run_id }}
          restore-keys: campsites-

      - name: Ensure state file exists
        run: '[ -f camply_campsites.json ] || echo "[]" > camply_campsites.json'

      - name: Search for ~55 minutes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          # Mount Rainier only: Cougar Rock, Ohanapecosh, White River.
          #
          # Each target night is searched as its own exact one-night window
          # (arrive Sat, leave Sun). A single wide window with --weekends would
          # also match Sept 11/12/18/25 and notify about nights you don't want.
          CAMPGROUNDS="--campground 232466 --campground 232465 --campground 259031"
          NIGHTS="2026-09-05:2026-09-06 2026-09-19:2026-09-20 2026-09-26:2026-09-27"

          DEADLINE=$(( SECONDS + 3300 ))   # ~55 minutes
          round=0

          while :; do
            round=$(( round + 1 ))
            echo "::group::Round $round"
            for pair in $NIGHTS; do
              start="${pair%%:*}"
              end="${pair##*:}"
              echo "--- arriving $start ---"
              camply campsites \
                $CAMPGROUNDS \
                --start-date "$start" \
                --end-date   "$end" \
                --nights 1 \
                --notifications ntfy \
                --search-once \
                --offline-search \
                --offline-search-path camply_campsites.json
              code=$?
              if [ $code -ne 0 ]; then
                echo "camply failed with exit $code"
                exit $code
              fi
            done
            echo "::endgroup::"

            # Stop before overrunning the window rather than sleeping past it.
            if [ $SECONDS -ge $(( DEADLINE - 600 )) ]; then
              break
            fi
            sleep 600
          done

          echo "Search window complete after $round rounds."
