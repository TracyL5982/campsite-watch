name: Campsite Watch

# Runs on GitHub's servers, so it keeps hunting whether or not your
# laptop is on. Free-tier scheduled workflows are best-effort: GitHub
# often delays them a few minutes and can skip a run under heavy load.
# Expect a real cadence closer to every 10-20 minutes.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

# If a run is still going when the next one fires, skip the new one
# rather than stacking up duplicate searches.
concurrency:
  group: campsite-watch
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install camply
        run: pip install --quiet camply==0.34.2

      # Remembers which campsites were already reported, so a site that
      # stays open for an hour notifies once instead of six times.
      # Key is unique per run so each run writes a fresh entry;
      # restore-keys pulls the most recent one back in.
      - name: Restore seen-campsites state
        uses: actions/cache@v4
        with:
          path: camply_campsites.json
          key: campsites-${{ github.run_id }}
          restore-keys: campsites-

      - name: Ensure state file exists
        run: '[ -f camply_campsites.json ] || echo "[]" > camply_campsites.json'

      - name: Search
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          camply campsites \
            --campground 232466 \
            --campground 232465 \
            --campground 259031 \
            --campground 247592 \
            --campground 232464 \
            --campground 247591 \
            --campground 251906 \
            --campground 259084 \
            --campground 247586 \
            --start-date 2026-08-21 \
            --end-date   2026-09-06 \
            --nights 1 \
            --weekends \
            --notifications ntfy \
            --search-once \
            --offline-search \
            --offline-search-path camply_campsites.json
