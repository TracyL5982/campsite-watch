name: Campsite Watch

# GitHub's free-tier cron is unreliable — triggers get delayed under load and
# sometimes dropped entirely. So instead of "fire a 30-second job every 10
# minutes" (which loses a full slot every time a trigger is missed), this fires
# hourly and each run polls continuously for ~55 minutes using camply's own
# --search-forever loop. A delayed or dropped trigger then costs a gap, not the
# whole schedule, and camply dedupes notifications in-process across the hour.
on:
  schedule:
    - cron: "3 * * * *" # a few minutes past the hour: the top of the hour is the most congested slot
  workflow_dispatch:

concurrency:
  group: campsite-watch
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install camply
        run: pip install --quiet camply==0.34.2

      # Carries "already reported" state across hourly runs, so a site that
      # stays open doesn't re-notify every hour. Within an hour, camply's own
      # in-process dedupe handles it.
      - name: Restore seen-campsites state
        uses: actions/cache@v4
        with:
          path: camply_campsites.json
          key: campsites-${{ github.run_id }}
          restore-keys: campsites-

      - name: Ensure state file exists
        run: '[ -f camply_campsites.json ] || echo "[]" > camply_campsites.json'

      - name: Search for ~55 minutes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          # `timeout` kills camply at 55m and exits 124 — that is the expected,
          # successful outcome here, so only 124 and 0 count as success.
          set +e
          timeout 55m camply campsites \
            --campground 232466 \
            --campground 232465 \
            --campground 259031 \
            --campground 247592 \
            --campground 232464 \
            --campground 247591 \
            --campground 251906 \
            --campground 259084 \
            --campground 247586 \
            --start-date 2026-08-21 \
            --end-date   2026-09-06 \
            --nights 1 \
            --weekends \
            --notifications ntfy \
            --search-forever \
            --polling-interval 10 \
            --offline-search \
            --offline-search-path camply_campsites.json
          code=$?
          set -e
          if [ $code -eq 124 ] || [ $code -eq 0 ]; then
            echo "Search window finished cleanly (exit $code)."
            exit 0
          fi
          echo "camply failed with exit $code"
          exit $code
